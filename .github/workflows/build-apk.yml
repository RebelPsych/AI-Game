name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK 36
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm dependencies
        run: npm install

      - name: Run TypeScript check and build web bundle
        run: |
          npm run lint
          npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Copy APK to test folder
        run: |
          mkdir -p test
          cp android/app/build/outputs/apk/debug/app-debug.apk test/test.apk
          ls -lh test/test.apk

      - name: Commit test/test.apk directly to repository
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f test/test.apk
          if ! git diff --cached --quiet; then
            git commit -m "Build playable Android APK in test/test.apk [skip ci]"
            git pull --rebase -X theirs || true
            git push
          fi

      - name: Publish GitHub Release with direct APK download
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest test/test.apk --clobber
          else
            gh release create latest test/test.apk \
              --title "The Weight of Warmth (Android APK)" \
              --notes "Download and install test.apk directly on Android."
          fi

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-apk
          path: test/test.apk

name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK 36
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER=$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install

      - name: Build web bundle
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Copy APK to the Weight of Warmth folder
        run: |
          mkdir -p "the Weight of Warmth"
          cp android/app/build/outputs/apk/debug/app-debug.apk "the Weight of Warmth/test.apk"

      - name: Commit APK directly to repository folder
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "the Weight of Warmth/test.apk"
          if ! git diff --cached --quiet; then
            git commit -m "Build playable APK test.apk in the Weight of Warmth folder [skip ci]"
            git push
          fi

      - name: Publish GitHub Release with direct APK download
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest "the Weight of Warmth/test.apk" --clobber
          else
            gh release create latest "the Weight of Warmth/test.apk" \
              --title "The Weight of Warmth (Android APK)" \
              --notes "Playable Android APK (test.apk) built automatically from the latest commit."
          fi

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-apk
          path: "the Weight of Warmth/test.apk"
